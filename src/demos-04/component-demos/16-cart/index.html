<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>購物車實戰</title>
    <!-- 樣式放在 index.html、不放進 .vue：.vue 要跟講義一字不差 -->
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: #2c2c2c;
        background: #f6f4f0;
      }

      .navbar {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 32px;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      }

      .logo {
        font-size: 20px;
        font-weight: 700;
        color: inherit;
        text-decoration: none;
      }

      .cart-link {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .badge {
        min-width: 22px;
        padding: 2px 7px;
        border-radius: 999px;
        font-size: 13px;
        text-align: center;
        color: #fff;
        background: #e4572e;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr 420px;
        gap: 24px;
        padding: 24px 32px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          padding: 16px;
        }
      }

      .product-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
        align-content: start;
      }

      .product-card {
        overflow: hidden;
        border-radius: 12px;
        background: #fff;
      }

      .product-card img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }

      .product-info {
        padding: 12px;
      }

      .product-title {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 8px;
      }

      .product-title h3 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .product-info button {
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: #2c2c2c;
        cursor: pointer;
      }

      .cart {
        align-self: start;
        padding: 16px;
        border-radius: 12px;
        background: #fff;
      }

      .empty-cart {
        padding: 24px 0;
        text-align: center;
        color: #888;
      }

      .cart-item {
        display: grid;
        grid-template-columns: auto 56px 1fr auto auto;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
      }

      .cart-item img {
        width: 56px;
        height: 56px;
        border-radius: 8px;
        object-fit: cover;
      }

      .cart-info h4 {
        margin: 0 0 4px;
        font-size: 14px;
      }

      .cart-info span {
        font-size: 13px;
        color: #888;
      }

      .remove {
        border: 0;
        font-size: 18px;
        color: #888;
        background: none;
        cursor: pointer;
      }

      .cart-total {
        padding-top: 12px;
        font-size: 18px;
        font-weight: 700;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
